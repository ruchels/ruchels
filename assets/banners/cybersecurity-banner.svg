<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" fill="none">
  <title>Cyber Defense &amp; Security Operations — Ruchel (RaizeL)</title>
  <desc>Showcase of Ruchel's defensive security, blue team operations, forensics, and LKS Cyber Security competition achievement.</desc>
  <defs>
    <linearGradient id="cyber-bg" x1="40" y1="20" x2="1040" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0e1c"/><stop offset=".5" stop-color="#12182b"/><stop offset="1" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="cyber-accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00f0ff"/><stop offset=".45" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cyber-border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00f0ff" stop-opacity=".4"/><stop offset=".5" stop-color="#3b82f6" stop-opacity=".15"/><stop offset="1" stop-color="#818cf8" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="sec-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.07"/>
    </pattern>
    <filter id="c-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .c-eyebrow { font: 600 13px 'Segoe UI', Arial, sans-serif; letter-spacing: 2.8px; fill: #38bdf8; }
      .c-title { font: 700 36px 'Segoe UI', Arial, sans-serif; letter-spacing: -1px; fill: #f8fafc; }
      .c-sub { font: 15px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .c-card-title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #f1f5f9; }
      .c-card-desc { font: 12.5px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .c-tag { font: 600 11px monospace; fill: #00f0ff; letter-spacing: 1.5px; }
      .c-pulse { animation: c-pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes c-pulse { 0%, 100% { opacity: .5; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.05); } }
      @media (prefers-reduced-motion: reduce) { .c-pulse { animation: none; } }
    </style>
  </defs>

  <rect x="10" y="10" width="1060" height="320" rx="24" fill="url(#cyber-bg)" stroke="url(#cyber-border)" stroke-width="1.8"/>
  <rect x="10" y="10" width="1060" height="320" rx="24" fill="url(#sec-grid)"/>

  <!-- Radar / SOC node in top right -->
  <g transform="translate(980 75)">
    <circle cx="0" cy="0" r="55" fill="#00f0ff" opacity=".04"/>
    <circle cx="0" cy="0" r="40" stroke="#38bdf8" stroke-opacity=".2" stroke-width="1"/>
    <circle cx="0" cy="0" r="22" stroke="#00f0ff" stroke-opacity=".35" stroke-dasharray="3 5"/>
    <circle class="c-pulse" cx="0" cy="0" r="5" fill="#00f0ff" filter="url(#c-glow)"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#38bdf8" stroke-opacity=".15"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#38bdf8" stroke-opacity=".15"/>
  </g>

  <!-- Header -->
  <g transform="translate(52 48)">
    <text class="c-eyebrow">BLUE TEAM · SOC ANALYSIS · NETWORK HARDENING</text>
    <text y="42" class="c-title">Cyber Defense &amp; Security Operations</text>
    <text y="70" class="c-sub">Hands-on experience in defensive security, traffic analysis, incident triage, and secure system architectures.</text>
  </g>

  <!-- 4 Cards -->
  <g transform="translate(52 165)">
    <!-- Card 1: LKS Achievement -->
    <g transform="translate(0 0)">
      <rect width="228" height="135" rx="16" fill="#0f172a" fill-opacity=".8" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.2"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#38bdf8" fill-opacity=".12"/>
      <text x="25" y="39" font-size="18" fill="#38bdf8">🏆</text>
      <text x="60" y="32" class="c-tag">PROVINCIAL</text>
      <text x="60" y="48" class="c-card-title">2nd Place, LKS</text>
      <text x="16" y="82" class="c-card-desc">LKS Cyber Security 2026</text>
      <text x="16" y="102" class="c-card-desc">Kepulauan Riau Level</text>
    </g>

    <!-- Card 2: SOC & Blue Team -->
    <g transform="translate(248 0)">
      <rect width="228" height="135" rx="16" fill="#0f172a" fill-opacity=".8" stroke="#818cf8" stroke-opacity=".25" stroke-width="1.2"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#818cf8" fill-opacity=".12"/>
      <text x="25" y="39" font-size="18" fill="#818cf8">🛡️</text>
      <text x="60" y="32" class="c-tag" fill="#818cf8">BLUE TEAM</text>
      <text x="60" y="48" class="c-card-title">SOC Operations</text>
      <text x="16" y="82" class="c-card-desc">SIEM alert triaging</text>
      <text x="16" y="102" class="c-card-desc">Log correlation &amp; forensics</text>
    </g>

    <!-- Card 3: Network Defense & Wireshark -->
    <g transform="translate(496 0)">
      <rect width="228" height="135" rx="16" fill="#0f172a" fill-opacity=".8" stroke="#00f0ff" stroke-opacity=".25" stroke-width="1.2"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#00f0ff" fill-opacity=".12"/>
      <text x="25" y="39" font-size="18" fill="#00f0ff">🔍</text>
      <text x="60" y="32" class="c-tag">INSPECTION</text>
      <text x="60" y="48" class="c-card-title">Traffic Analysis</text>
      <text x="16" y="82" class="c-card-desc">Packet analysis (Wireshark)</text>
      <text x="16" y="102" class="c-card-desc">Protocol investigation</text>
    </g>

    <!-- Card 4: Web Security & Hardening -->
    <g transform="translate(744 0)">
      <rect width="232" height="135" rx="16" fill="#0f172a" fill-opacity=".8" stroke="#22d3ee" stroke-opacity=".25" stroke-width="1.2"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#22d3ee" fill-opacity=".12"/>
      <text x="25" y="39" font-size="18" fill="#22d3ee">🔒</text>
      <text x="60" y="32" class="c-tag">APPLICATION</text>
      <text x="60" y="48" class="c-card-title">App Hardening</text>
      <text x="16" y="82" class="c-card-desc">OWASP Top 10 defense</text>
      <text x="16" y="102" class="c-card-desc">Safe Docker sandboxing</text>
    </g>
  </g>
</svg>
