<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Ruchel Afwa Mabrur — UI/UX Designer and Front-End Developer</title>
  <desc id="desc">An animated violet and cyan digital landscape with orbiting lights around Ruchel's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090817"/>
      <stop offset=".52" stop-color="#171329"/>
      <stop offset="1" stop-color="#08232d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa"/>
      <stop offset=".48" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#fb7185"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#b8b3d8" stroke-opacity=".09"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <circle cx="930" cy="180" r="245" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="opacity" values=".58;.95;.58" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="45" r="150" fill="url(#glow)" opacity=".55" filter="url(#blur)">
    <animate attributeName="r" values="130;175;130" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".62">
    <path d="M730 0L1040 380M900 0L1210 380M1070 0L1380 380" stroke-opacity=".22"/>
    <ellipse cx="955" cy="184" rx="226" ry="92" transform="rotate(-20 955 184)"/>
    <ellipse cx="955" cy="184" rx="185" ry="120" transform="rotate(35 955 184)" opacity=".68"/>
    <ellipse cx="955" cy="184" rx="250" ry="65" transform="rotate(12 955 184)" stroke-dasharray="3 12" opacity=".55"/>
  </g>
  <g fill="#e0f2fe" filter="url(#soft-glow)">
    <circle cx="730" cy="155" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="97" r="3"><animate attributeName="opacity" values="1;.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1092" cy="280" r="2.5"><animate attributeName="opacity" values=".3;1;.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="300" r="2"><animate attributeName="opacity" values="1;.25;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="76" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="955" cy="184" r="10" fill="#a5f3fc" opacity=".85" filter="url(#soft-glow)">
    <animate attributeName="r" values="7;12;7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="78" y="98" fill="#a5f3fc" font-family="monospace" font-size="14" letter-spacing="4">UI/UX DESIGNER  ·  FRONT-END DEVELOPER</text>
  <text x="72" y="190" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" letter-spacing="-2">RUCHEL AFWA</text>
  <text x="78" y="235" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="23" letter-spacing="2">DESIGNING THOUGHTFUL DIGITAL EXPERIENCES</text>
  <path d="M80 270H420" stroke="url(#neon)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 500;340 500;0 500" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="80" y="313" fill="#9ca3af" font-family="monospace" font-size="14">BATAM, INDONESIA  ·  DESIGN WITH INTENTION, BUILD WITH PURPOSE</text>
  <text x="1120" y="345" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">CREATIVE SYSTEMS // 001</text>
</svg>
