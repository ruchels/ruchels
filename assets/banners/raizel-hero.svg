<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Ruchel Afwa Mabrur (RaizeL) — Software Developer, Cybersecurity Enthusiast &amp; AI Explorer</title>
  <desc id="desc">A cinematic animated crimson-violet and electric cyan developer hero banner: Ruchel (RaizeL), featuring software engineering, defensive cybersecurity, and intelligent systems.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080711"/><stop offset=".52" stop-color="#17101f"/><stop offset="1" stop-color="#090d19"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#27172b"/><stop offset=".48" stop-color="#11121f"/><stop offset="1" stop-color="#080b15"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#fff1f4"/><stop offset=".36" stop-color="#d9cbd8"/><stop offset=".72" stop-color="#92839b"/><stop offset="1" stop-color="#51475f"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb1c0"/><stop offset=".45" stop-color="#f43f5e"/><stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f5d0fe"/><stop offset=".5" stop-color="#fb7185"/><stop offset="1" stop-color="#c4b5fd"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="moonlight">
      <stop stop-color="#fda4af" stop-opacity=".32"/><stop offset=".55" stop-color="#a855f7" stop-opacity=".12"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="74" height="74" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="13" r=".8" fill="#e9d5ff" opacity=".55"/><circle cx="48" cy="38" r=".65" fill="#fecdd3" opacity=".5"/><circle cx="27" cy="65" r=".55" fill="#fff" opacity=".45"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1200" height="430" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="430" fill="url(#night)"/>
    <rect width="1200" height="430" fill="url(#stars)"/>
    <circle cx="880" cy="210" r="260" fill="url(#moonlight)" filter="url(#blur)"><animate attributeName="opacity" values=".65;1;.65" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="82" r="122" fill="none" stroke="#fda4af" stroke-opacity=".17" stroke-width="1"/>
    <circle cx="1010" cy="82" r="148" fill="none" stroke="#c4b5fd" stroke-opacity=".11" stroke-width="1" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="0 1010 82" to="360 1010 82" dur="75s" repeatCount="indefinite"/></circle>
    <path d="M0 365 Q260 325 470 388 T910 372 T1280 390V450H0Z" fill="#0a0a13" opacity=".65"/>
    <!-- Original anime-inspired noble vampire portrait -->
    <g transform="translate(0 2)">
