      <path d="M995 314 Q958 273 931 280 L900 345 L944 326 L967 430 H1014Z" fill="#111321" stroke="#72516c" stroke-width="2"/>
      <path d="M886 338 L900 356 L914 338 L922 430 H878Z" fill="#a4163e" opacity=".88"/>
      <circle cx="900" cy="374" r="5" fill="#fda4af" filter="url(#glow)"/>
      <path d="M900 379V417" stroke="#fda4af" stroke-opacity=".6"/>
      <!-- face -->
      <path d="M854 148 Q855 103 900 98 Q947 104 947 151 L940 226 Q929 266 901 274 Q872 265 860 226Z" fill="#eadde5"/>
      <path d="M855 188 Q848 136 865 112 Q879 94 905 94 Q946 96 953 139 L942 166 Q931 143 910 136 Q890 151 855 150Z" fill="#e9e1eb"/>
      <path d="M855 141 Q831 191 858 256 Q839 245 829 208 Q818 162 839 126 Q852 94 885 84 Q921 73 950 100 Q976 128 968 177 Q964 218 941 251 Q954 203 943 157 Q932 124 906 119 Q883 143 855 141Z" fill="url(#hair)" stroke="#fff1f4" stroke-opacity=".28" stroke-width="2"/>
      <path d="M866 119 Q841 176 862 229 Q844 211 843 175 Q841 134 866 108" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="4"/>
      <path d="M935 112 Q959 159 944 222 Q964 192 961 155 Q958 125 941 107" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="3"/>
      <!-- fringe and eyes -->
      <path d="M860 139 Q875 116 895 115 Q909 115 919 128 Q933 112 946 123 L941 166 Q928 149 912 151 Q899 154 891 173 Q883 151 860 161Z" fill="url(#hair)"/>
      <path d="M866 177 Q879 166 894 174" fill="none" stroke="#51475f" stroke-width="3" stroke-linecap="round"/>
      <path d="M911 174 Q925 166 939 177" fill="none" stroke="#51475f" stroke-width="3" stroke-linecap="round"/>
      <path d="M869 184 Q880 177 892 184 Q881 193 870 187Z" fill="#4b1831"/>
      <path d="M914 184 Q926 177 937 184 Q927 193 915 187Z" fill="#4b1831"/>
      <ellipse cx="882" cy="185" rx="3.5" ry="4" fill="#fb7185" filter="url(#glow)"/><ellipse cx="926" cy="185" rx="3.5" ry="4" fill="#fb7185" filter="url(#glow)"/>
      <path d="M899 186 L895 209 L902 211" fill="none" stroke="#b69eae" stroke-width="2" stroke-linecap="round"/>
      <path d="M890 225 Q900 229 910 224" fill="none" stroke="#9f536c" stroke-width="2" stroke-linecap="round"/>
      <path d="M850 174 Q841 220 861 258" fill="none" stroke="#d5c6d6" stroke-width="7" opacity=".8"/>
      <path d="M949 170 Q957 218 938 257" fill="none" stroke="#b7a9bd" stroke-width="6" opacity=".75"/>
      <path d="M852 277 Q900 300 949 276" fill="none" stroke="#fda4af" stroke-opacity=".45" stroke-width="2"/>
      <path d="M830 303 L851 291 L865 323 L843 339Z M970 293 L991 306 L957 339 L937 323Z" fill="#311a30" stroke="#9f536c" stroke-width="1.5"/>
    </g>
    <!-- drifting rose petals -->
    <g fill="url(#ruby)" filter="url(#glow)" opacity=".8">
      <path d="M0 -7 Q8 -5 5 0 Q2 5 -4 5 Q-8 0 0 -7Z" transform="translate(727 126) rotate(25)"><animateTransform attributeName="transform" type="translate" values="727 126;700 231;727 126" dur="11s" repeatCount="indefinite"/></path>
      <path d="M0 -6 Q7 -4 4 1 Q1 5 -5 4 Q-7 0 0 -6Z" transform="translate(1070 248) rotate(-35)"><animateTransform attributeName="transform" type="translate" values="1070 248;1040 355;1070 248" dur="13s" repeatCount="indefinite"/></path>
      <path d="M0 -5 Q6 -4 4 1 Q0 5 -4 3 Q-6 -1 0 -5Z" transform="translate(765 334) rotate(60)"><animateTransform attributeName="transform" type="translate" values="765 334;742 405;765 334" dur="9s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#ffe4e6" filter="url(#glow)">
      <circle cx="752" cy="181" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1057" cy="143" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="326" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="275" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.7s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M72 68H150" stroke="url(#silver)" stroke-width="2"/>
    <text x="72" y="105" fill="#fda4af" font-family="monospace" font-size="13" letter-spacing="4">RUCHEL AFWA MABRUR  //  RAIZEL</text>
    <text x="66" y="185" fill="#fff7fb" font-family="Georgia,serif" font-size="64" font-weight="700" letter-spacing="-2">RAIZEL</text>
    <text x="72" y="222" fill="#d8c6dc" font-family="Georgia,serif" font-size="19" letter-spacing="6">VAN ASTREA · DEVELOPER &amp; DEFENDER</text>
    <path d="M74 246H450" stroke="url(#silver)" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 500"><animate attributeName="stroke-dasharray" values="0 500;376 500;0 500" dur="6s" repeatCount="indefinite"/></path>
    <text x="72" y="295" fill="#ffffff" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="1">Building Digital Experiences · Exploring Intelligent Systems</text>
    <text x="72" y="324" fill="#67e8f9" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="2">Securing Modern Architectures &amp; Future Infrastructures</text>
    <text x="73" y="358" fill="#b7a9bd" font-family="monospace" font-size="12" letter-spacing="2.5">SOFTWARE ENGINEERING · CYBER DEFENSE · AI SYSTEMS</text>
    <text x="1125" y="397" fill="#67e8f9" opacity=".85" text-anchor="end" font-family="monospace" font-size="11" letter-spacing="2.5">BATAM, ID // UIB IT // 2026</text>
  </g>
</svg>
