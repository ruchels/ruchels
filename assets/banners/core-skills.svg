<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" fill="none">
  <title>Technical Domains &amp; Competencies — Ruchel (RaizeL)</title>
  <desc>Overview of Ruchel's technical focus areas across software engineering, defensive cybersecurity, systems infrastructure, and AI tooling.</desc>
  <defs>
    <linearGradient id="m-bg" x1="45" y1="16" x2="1025" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e101f"/><stop offset="1" stop-color="#18132d"/>
    </linearGradient>
    <linearGradient id="c-blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="c-purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="c-cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="c-emerald" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="m-glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m-eyebrow { font: 600 13px 'Segoe UI', Arial, sans-serif; letter-spacing: 2.7px; fill: #a78bfa; }
      .m-title { font: 700 35px 'Segoe UI', Arial, sans-serif; letter-spacing: -.8px; fill: #f8fafc; }
      .m-caption { font: 14px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .m-card-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #f1f5f9; }
      .m-pill { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .m-badge { font: 600 10.5px monospace; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect x="10" y="10" width="1060" height="400" rx="24" fill="url(#m-bg)" stroke="#3b2b54" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(52 50)">
    <text class="m-eyebrow">PRACTICAL DOMAINS &amp; FOCUS</text>
    <text y="38" class="m-title">Technical Competency Matrix</text>
    <text y="64" class="m-caption">Disciplines honed through platform engineering, vocational networking (TKJ), and competitive cyber security.</text>
  </g>

  <!-- 4 Pillars Grid -->
  <g transform="translate(52 145)">
    <!-- Column 1: Software Development -->
    <g transform="translate(0 0)">
      <rect width="232" height="235" rx="16" fill="#13172c" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1.2"/>
      <rect width="232" height="4" rx="2" fill="url(#c-blue)"/>
      <text x="20" y="36" class="m-badge" fill="#38bdf8">DOMAIN 01</text>
      <text x="20" y="60" class="m-card-title">Software Dev</text>
      <line x1="20" y1="74" x2="212" y2="74" stroke="#ffffff" stroke-opacity=".08"/>
      <g transform="translate(20 90)">
        <text class="m-pill" y="0">✦ Full-Stack Next.js 16</text>
        <text class="m-pill" y="26">✦ TypeScript &amp; React 19</text>
        <text class="m-pill" y="52">✦ RESTful APIs &amp; SQLite</text>
        <text class="m-pill" y="78">✦ State Architecture</text>
        <text class="m-pill" y="104">✦ Python &amp; Automation</text>
        <text class="m-pill" y="130">✦ C / Rust (Exploring)</text>
      </g>
    </g>

    <!-- Column 2: Defensive Cybersecurity -->
    <g transform="translate(252 0)">
      <rect width="232" height="235" rx="16" fill="#13172c" stroke="#c084fc" stroke-opacity=".25" stroke-width="1.2"/>
      <rect width="232" height="4" rx="2" fill="url(#c-purple)"/>
      <text x="20" y="36" class="m-badge" fill="#c084fc">DOMAIN 02</text>
      <text x="20" y="60" class="m-card-title">Cyber Defense</text>
      <line x1="20" y1="74" x2="212" y2="74" stroke="#ffffff" stroke-opacity=".08"/>
      <g transform="translate(20 90)">
        <text class="m-pill" y="0">🛡️ SOC &amp; SIEM Triaging</text>
        <text class="m-pill" y="26">🛡️ Network Forensics</text>
        <text class="m-pill" y="52">🛡️ Wireshark Inspection</text>
        <text class="m-pill" y="78">🛡️ OWASP Remediation</text>
        <text class="m-pill" y="104">🛡️ Range Lab Defense</text>
        <text class="m-pill" y="130">🛡️ LKS Cyber Security 2nd</text>
      </g>
    </g>

    <!-- Column 3: Networks & Systems -->
    <g transform="translate(504 0)">
      <rect width="232" height="235" rx="16" fill="#13172c" stroke="#22d3ee" stroke-opacity=".25" stroke-width="1.2"/>
      <rect width="232" height="4" rx="2" fill="url(#c-cyan)"/>
      <text x="20" y="36" class="m-badge" fill="#22d3ee">DOMAIN 03</text>
      <text x="20" y="60" class="m-card-title">Networks &amp; Systems</text>
      <line x1="20" y1="74" x2="212" y2="74" stroke="#ffffff" stroke-opacity=".08"/>
      <g transform="translate(20 90)">
        <text class="m-pill" y="0">⚡ Linux Server Hardening</text>
        <text class="m-pill" y="26">⚡ MikroTik RouterOS</text>
        <text class="m-pill" y="52">⚡ TCP/IP &amp; VLAN Routing</text>
        <text class="m-pill" y="78">⚡ Docker Sandboxing</text>
        <text class="m-pill" y="104">⚡ Bash &amp; Shell Scripting</text>
        <text class="m-pill" y="130">⚡ TKJ Foundation (Vocational)</text>
      </g>
    </g>

    <!-- Column 4: AI & Product Design -->
    <g transform="translate(756 0)">
      <rect width="232" height="235" rx="16" fill="#13172c" stroke="#34d399" stroke-opacity=".25" stroke-width="1.2"/>
      <rect width="232" height="4" rx="2" fill="url(#c-emerald)"/>
      <text x="20" y="36" class="m-badge" fill="#34d399">DOMAIN 04</text>
      <text x="20" y="60" class="m-card-title">AI &amp; Product Design</text>
      <line x1="20" y1="74" x2="212" y2="74" stroke="#ffffff" stroke-opacity=".08"/>
      <g transform="translate(20 90)">
        <text class="m-pill" y="0">◈ AI-Assisted Workflows</text>
        <text class="m-pill" y="26">◈ Context Tool Architecture</text>
        <text class="m-pill" y="52">◈ High-Fidelity UI/UX</text>
        <text class="m-pill" y="78">◈ Design Systems &amp; SVG</text>
        <text class="m-pill" y="104">◈ Web Audio Sound Design</text>
        <text class="m-pill" y="130">◈ Accessibility (a11y)</text>
      </g>
    </g>
  </g>
</svg>
